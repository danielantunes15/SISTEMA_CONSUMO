<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking de Cavalos - Sistema de Gestão de Frotas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- Importação do ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
</head>
<body>
    <div class="app-container">
        <app-sidebar></app-sidebar>
        <main class="main-content">
            <app-topbar title="Ranking de Cavalos"></app-topbar>
            <div class="content-area">
                
                <!-- GRÁFICO DE RANKING -->
                <div class="table-card full-width" style="margin-bottom: 24px; padding-bottom: 10px;">
                    <div id="rankingKmChart" style="width: 100%; height: 500px;"></div>
                </div>

                <!-- NOVA TABELA: LISTA COMPLETA DE PLACAS E KM -->
                <div class="table-card full-width">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h3 style="margin: 0; color: #f8fafc;"><i class="fas fa-list-ol" style="color: #38bdf8; margin-right: 8px;"></i> Lista Completa de Distâncias (KM)</h3>
                    </div>
                    <div class="table-wrapper" style="max-height: 600px; overflow-y: auto;">
                        <table>
                            <thead style="position: sticky; top: 0; background: #1e293b; z-index: 1;">
                                <tr>
                                    <th style="width: 80px; text-align: center;">Posição</th>
                                    <th>Placa do Cavalo (Conjunto)</th>
                                    <th style="text-align: right; padding-right: 20px;">Soma de Distância (KM)</th>
                                </tr>
                            </thead>
                            <tbody id="ranking-table-list"></tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/menu.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cavalos.js"></script>
</body>
</html>
